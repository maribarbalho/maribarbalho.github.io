# Publicação no GitHub Pages.
# Só roda em push na main (ou manualmente). Enquanto o redesign estiver
# na branch `redesign`, nada é publicado. Para ativar: mesclar na main e,
# em Settings > Pages, trocar a origem para "GitHub Actions".
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # Rotas não pré-renderizadas caem no fallback da SPA.
      - run: cp build/client/__spa-fallback.html build/client/404.html
      - run: touch build/client/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
